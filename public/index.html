<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Phi-nguin</title>
  <meta name="description" content="Phi-nguin: chat with models running on your local Ollama server">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17182b" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar-head">
        <div class="brand">
          <img class="brand-logo" src="/icon-192.png" alt="" width="30" height="30">
          <span>Phi-nguin</span>
        </div>
        <button class="icon-btn only-mobile" id="closeSidebar" type="button" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <nav class="chat-list" id="chatList"></nav>
      <div class="sidebar-foot">
        <div class="status" id="status" title="Ollama connection status">
          <span class="dot"></span><span class="status-text">Connecting…</span>
        </div>
        <div class="foot-actions">
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme" title="Theme: system">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18V3Z"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
          <button class="icon-btn" id="logoutBtn" type="button" aria-label="Sign out" title="Sign out" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" type="button" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <label class="model-picker">
          <span class="sr-only">Model</span>
          <select id="modelSelect" aria-label="Model"></select>
          <svg class="chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
        </label>
        <span class="model-meta" id="modelMeta"></span>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-box">
          <div class="attachments" id="attachments" hidden></div>
          <textarea id="input" rows="1" placeholder="Send a message…" aria-label="Message"></textarea>
          <div class="composer-row">
            <button class="icon-btn" id="attachBtn" type="button" aria-label="Attach image" title="Attach image (vision models)" hidden>
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m21.4 11.1-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
            </button>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
            <span class="spacer"></span>
            <button class="send-btn" id="sendBtn" type="submit" aria-label="Send" disabled>
              <svg class="i-send" viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg class="i-stop" viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <p class="hint">Runs on your local Ollama · <kbd>Enter</kbd> to send, <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</p>
      </form>
    </main>
  </div>

  <dialog class="dialog" id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>
      <label class="field">
        <span>System prompt</span>
        <textarea id="systemPrompt" rows="4" placeholder="e.g. You are a concise, helpful assistant."></textarea>
        <small>Sent at the start of every conversation.</small>
      </label>
      <label class="field">
        <span>Temperature <output id="tempOut">0.7</output></span>
        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
        <small>Lower is more focused, higher is more creative.</small>
      </label>
      <label class="field">
        <span>Context window (tokens)</span>
        <input type="number" id="numCtx" min="0" step="512" placeholder="Model default">
        <small>Leave blank to use the model's default. Larger uses more memory.</small>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn danger" id="clearAll">Delete all chats</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="cancelSettings">Cancel</button>
        <button type="submit" class="btn primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
